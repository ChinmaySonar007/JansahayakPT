      <stop offset="0%" stop-color="#1b4d43" />
      <stop offset="100%" stop-color="#0f2e28" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#2e6d60" stroke-width="1.2" />

  <!-- Cooperative Interlocking Hands & Shield Emblem -->
