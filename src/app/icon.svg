  <path d="M6.5 17.5 C6.5 11 11 7.5 16 7.5 C15.5 10.5 13.5 13 11 15 C9 16.5 8 18.5 8.5 20.5 C9 22.5 11 23.8 14 24 C11.5 24.8 8.5 23.8 7.2 21.8 C6.7 20.5 6.5 19 6.5 17.5 Z" fill="url(#emeraldGrad)" />

  <!-- Right Hand / Protective Wing (Cooperative Saffron Gold) -->
  <path d="M25.5 17.5 C25.5 11 21 7.5 16 7.5 C16.5 10.5 18.5 13 21 15 C23 16.5 24 18.5 23.5 20.5 C23 22.5 21 23.8 18 24 C20.5 24.8 23.5 23.8 24.8 21.8 C25.3 20.5 25.5 19 25.5 17.5 Z" fill="url(#goldGrad)" />

  <!-- Central Cooperative Core (Unity & Prosperity) -->
  <circle cx="16" cy="16" r="3.4" fill="#ffffff" />
  <circle cx="16" cy="16" r="2.2" fill="#f59e0b" />

  <!-- Apex Star (National Cooperative Mission) -->
